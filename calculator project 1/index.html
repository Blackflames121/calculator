<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<link rel="stylesheet" href="cal.css">
<body>
  <main class="main" id="Main">
      <h2>JIDEX</h2>
    <section class="screen-section">
    
      <input type="text" class="screen" id="display">

    </section>

    <section class="button-section" id="BtnSection">
      <div>
       
        
           <div>
            <button type="button" class="btn">7</button>
            <button type="button" class="btn">8</button>
            <button type="button" class="btn">9</button>
            <button type="button" class="Delbtn" id="DelBtn">Del</button>
           </div>

           <div>
            <button type="button" class="btn">4</button>
            <button type="button" class="btn">5</button>
            <button type="button" class="btn">6</button>
            <button type="button" class="btn">+</button>
           </div>

           <div>
            <button type="button" class="btn">1</button>
            <button type="button" class="btn">2</button>
            <button type="button" class="btn">3</button>
            <button type="button" class="btn">-</button>
           </div>

           <div>
            <button type="button" class="btn">.</button>
            <button type="button" class="btn">0</button>
            <button type="button" class="btn">/</button>
            <button type="button" class="btn">X</button>
           </div>
           
           <div>
             <button type="button" class="Resetbtn" id="ResetBtn">Reset</button>
              <button type="button" class="Equalbtn" id="EqualBtn">=</button>
           </div>
      </div>
    </section>
  </main>

  <script src="cal.js"></script>
</body>
</html>
